<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <p>calc</p>
            <div class="right">
                <p>THEME</p>
                <div class="toggle">
                    <button class="btn" type="button"></button>
                </div>
            </div>
            <p>399,981</p>
        </div>
        
        <div class="inner">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>DEL</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>+</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
            <button>.</button>
            <button>0</button>
            <button>/</button>
            <button>x</button>
            <button>RESET</button>
            <button>=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
